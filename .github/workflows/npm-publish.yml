name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@collaborne'
          cache: npm
      - run: npm ci --unsafe-perm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME}" = "v$(node --print 'require(\"./package.json\").version')"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # npm trusted publishing requires a recent npm CLI for GitHub OIDC.
      - run: npx --yes npm@^11.5.1 publish
